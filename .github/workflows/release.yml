name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag' || inputs.tag
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm --ignore-scripts test
      - name: Pack and publish verified assets
        if: github.ref_type == 'tag' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          sha256sum "$archive" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "$archive" SHA256SUMS.txt --verify-tag --generate-notes --title "$RELEASE_TAG"
